
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UGS AI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/common.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #e5e5e5;
            color: #303030;
            font-family: Inter, sans-serif;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .notice {
            position: absolute;
            top: 15px;
            left: 18px;
            color: #777;
            font-size: 11px;
            font-weight: 500;
        }

        .header {
            height: 48px;
            flex-shrink: 0;
            border-bottom: 1px solid #d6d6d6;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 28px 20px;
            background: #ededed;
        }

        .chat-content {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
        }

        .messages {
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding-bottom: 20px;
        }

        .message {
            display: flex;
            flex-direction: column;
            gap: 7px;
            animation: appear 0.2s ease;
        }

        .message.user {
            align-items: flex-end;
        }

        .message.assistant {
            align-items: flex-start;
        }

        .message-body {
            max-width: 100%;
            font-size: 13px;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        .message.user .message-body {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 9px;
            background: #dcdcdc;
            white-space: pre-wrap;
        }

        .message.assistant .message-body {
            width: 100%;
            color: #333;
        }

        .message-body p {
            margin-bottom: 12px;
        }

        .message-body p:last-child {
            margin-bottom: 0;
        }

        .message-body h1,
        .message-body h2,
        .message-body h3 {
            margin: 20px 0 9px;
            color: #222;
        }

        .message-body h1 {
            font-size: 21px;
        }

        .message-body h2 {
            font-size: 18px;
        }

        .message-body h3 {
            font-size: 15px;
        }

        .message-body ul,
        .message-body ol {
            margin: 10px 0;
            padding-left: 22px;
        }

        .message-body li {
            padding: 3px 0;
        }

        .message-body blockquote {
            margin: 12px 0;
            padding-left: 13px;
            border-left: 2px solid #aaa;
            color: #777;
        }

        .message-body a {
            color: #555;
        }

        .message-body code:not(pre code) {
            padding: 2px 5px;
            border-radius: 4px;
            background: #dedede;
            font-size: 12px;
        }

        .code-container {
            margin: 12px 0;
            overflow: hidden;
            border-radius: 8px;
            background: #252525;
            color: #eee;
        }

        .code-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 12px;
            background: #303030;
            color: #aaa;
            font-size: 10px;
        }

        .copy-code,
        .message-actions button {
            border: none;
            background: transparent;
            color: #999;
            cursor: pointer;
            font-size: 10px;
        }

        .copy-code {
            color: #ccc;
        }

        .copy-code:hover,
        .message-actions button:hover {
            color: #fff;
        }

        .code-container pre {
            margin: 0;
            padding: 15px;
            overflow-x: auto;
        }

        .code-container pre code {
            font-size: 12px;
            line-height: 1.7;
        }

        .message-actions {
            display: flex;
            gap: 7px;
        }

        .thinking {
            display: flex;
            gap: 5px;
            padding: 8px 0;
        }

        .thinking span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #777;
            animation: bounce 0.8s infinite alternate;
        }

        .thinking span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .thinking span:nth-child(3) {
            animation-delay: 0.4s;
        }

        .composer-area {
            padding: 13px 20px 17px;
            background: #e5e5e5;
        }

        .composer-wrap {
            max-width: 760px;
            margin: 0 auto;
        }

        .composer {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 8px;
            border-radius: 9px;
            background: #d5d5d5;
        }

        textarea {
            flex: 1;
            min-width: 0;
            min-height: 40px;
            max-height: 140px;
            resize: none;
            padding: 11px 12px;
            border: 1px solid #e2e2e2;
            border-radius: 6px;
            outline: none;
            background: #fff;
            color: #303030;
            font-family: inherit;
            font-size: 13px;
            line-height: 1.4;
        }

        textarea::placeholder {
            color: #999;
        }

        textarea:focus {
            border-color: #bcbcbc;
        }

        .send {
            height: 40px;
            padding: 0 17px;
            border: none;
            border-radius: 6px;
            background: #2879e8;
            color: white;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .send:hover {
            background: #1767d5;
        }

        .send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            to {
                opacity: 0.3;
                transform: translateY(-4px);
            }
        }

        @media (max-width: 600px) {
            .notice {
                top: 15px;
                left: 12px;
                font-size: 10px;
            }

            .chat-area {
                padding: 20px 13px;
            }

            .composer-area {
                padding: 10px 12px 13px;
            }

            .send {
                padding: 0 13px;
            }
        }
    </style>
</head>

<body>
    <div class="app">

        <div class="notice">don't abuse, remake by @wezizal</div>

        <header class="header"></header>

        <main class="chat-area" id="chatArea">
            <div class="chat-content">
                <div class="messages" id="messages"></div>
            </div>
        </main>

        <footer class="composer-area">
            <div class="composer-wrap">
                <div class="composer">
                    <textarea id="prompt" rows="1" placeholder="Ask something..."></textarea>
                    <button class="send" id="sendBtn">Send</button>
                </div>
            </div>
        </footer>

    </div>

    <script>
        const WORKER_URL = "https://ugs-ai.novarabusiness-gg.workers.dev/";

        const conversation = [];

        const promptInput = document.getElementById("prompt");
        const sendButton = document.getElementById("sendBtn");
        const messages = document.getElementById("messages");
        const chatArea = document.getElementById("chatArea");

        let isSending = false;

        function scrollToBottom() {
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function copyText(text, button, originalText) {
            navigator.clipboard.writeText(text).then(() => {
                button.textContent = "Copied!";

                setTimeout(() => {
                    button.textContent = originalText;
                }, 1500);
            }).catch(() => {
                button.textContent = "Failed";

                setTimeout(() => {
                    button.textContent = originalText;
                }, 1500);
            });
        }

        function formatCode(body) {
            body.querySelectorAll("pre").forEach(pre => {
                const code = pre.querySelector("code");

                if (!code) return;

                if (window.hljs) {
                    hljs.highlightElement(code);
                }

                const container = document.createElement("div");
                container.className = "code-container";

                const header = document.createElement("div");
                header.className = "code-header";

                const language = document.createElement("span");
                const match = code.className.match(/language-(\w+)/);

                language.textContent = match ? match[1] : "Code";

                const copyButton = document.createElement("button");
                copyButton.className = "copy-code";
                copyButton.textContent = "Copy code";

                copyButton.addEventListener("click", () => {
                    copyText(code.textContent, copyButton, "Copy code");
                });

                header.append(language, copyButton);

                pre.replaceWith(container);
                container.append(header, pre);
            });
        }

        function addMessage(role, content) {
            const message = document.createElement("div");
            message.className = `message ${role}`;

            const body = document.createElement("div");
            body.className = "message-body";

            if (role === "user") {
                body.textContent = content;
            } else {
                body.innerHTML = DOMPurify.sanitize(marked.parse(content));
                formatCode(body);

                const actions = document.createElement("div");
                actions.className = "message-actions";

                const copyButton = document.createElement("button");
                copyButton.textContent = "Copy";

                copyButton.addEventListener("click", () => {
                    copyText(content, copyButton, "Copy");
                });

                actions.append(copyButton);
                message.append(body, actions);
            }

            if (role === "user") {
                message.append(body);
            }

            messages.append(message);
            scrollToBottom();

            return message;
        }

        function showThinking() {
            const message = document.createElement("div");
            message.className = "message assistant";
            message.id = "thinking";

            const dots = document.createElement("div");
            dots.className = "thinking";

            for (let i = 0; i < 3; i++) {
                dots.append(document.createElement("span"));
            }

            message.append(dots);
            messages.append(message);

            scrollToBottom();
        }

        async function sendMessage() {
            const text = promptInput.value.trim();

            if (!text || isSending) return;

            isSending = true;
            sendButton.disabled = true;

            promptInput.value = "";
            promptInput.style.height = "40px";

            conversation.push({
                role: "user",
                content: text
            });

            addMessage("user", text);
            showThinking();

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        messages: conversation
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Request failed.");
                }

                if (typeof data.response !== "string" || !data.response.trim()) {
                    throw new Error("The server returned an empty response.");
                }

                conversation.push({
                    role: "assistant",
                    content: data.response
                });

                document.getElementById("thinking")?.remove();
                addMessage("assistant", data.response);

            } catch (error) {
                document.getElementById("thinking")?.remove();

                addMessage(
                    "assistant",
                    "Unable to connect. " + error.message
                );

            } finally {
                isSending = false;
                sendButton.disabled = false;
                promptInput.focus();
            }
        }

        sendButton.addEventListener("click", sendMessage);

        promptInput.addEventListener("input", () => {
            promptInput.style.height = "40px";
            promptInput.style.height =
                Math.min(promptInput.scrollHeight, 140) + "px";
        });

        promptInput.addEventListener("keydown", event => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
