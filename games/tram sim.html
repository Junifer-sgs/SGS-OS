<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Tram Simulator</title>
  <style>
    html, body, #unity-container {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      font: 16px Arial, sans-serif;
      z-index: 2;
    }
    #error {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 10px;
      color: #ff7777;
      font: 13px monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      z-index: 3;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>
  <div id="loading">Preparing Tram Simulator...</div>
  <div id="error"></div>

  <script>
    const CDN = "https://cdn.jsdelivr.net/gh/linkawaken1979-alt/crazygames-rip@main/tram-simulator/Build/";
    const SDK_URL = "https://cdn.jsdelivr.net/gh/linkawaken1979-alt/crazygames-rip@main/supermarket-simulator/crazygames-sdk-v3.js";

    Object.defineProperty(document, "URL", {
      get: () => "https://www.crazygames.com/game/space-waves",
      configurable: true
    });
    Object.defineProperty(document, "documentURI", {
      get: () => "https://www.crazygames.com/game/space-waves",
      configurable: true
    });

    let gameInstance = null;
    const msgQueue = [];

    function SendMessage(obj, method, param) {
      if (gameInstance) {
        gameInstance.SendMessage(obj, method, param);
      } else {
        msgQueue.push([obj, method, param]);
      }
    }

    window.unityInstance = { SendMessage };
    window.UnitySDK = window.UnitySDK || {
      logError: (...args) => console.error(...args)
    };

    document.getElementById("unity-canvas")
      .addEventListener("webglcontextlost", e => e.preventDefault());

    function showError(error) {
      console.error(error);
      document.getElementById("loading").style.display = "none";
      document.getElementById("error").textContent =
        error?.stack || String(error);
    }

    async function fetchPart(url) {
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error("Failed to load " + url + " (HTTP " + response.status + ")");
      }
      return response.arrayBuffer();
    }

    async function joinParts(filename, count) {
      const parts = [];
      let totalSize = 0;
      const loading = document.getElementById("loading");

      for (let i = 0; i < count; i++) {
        const name = filename + ".part" + String(i).padStart(3, "0");
        const url = CDN + name;
        loading.textContent = "Downloading " + filename + " — part " + (i + 1) + "/" + count;
        const buffer = await fetchPart(url);
        parts.push(buffer);
        totalSize += buffer.byteLength;
      }

      const combined = new Uint8Array(totalSize);
      let offset = 0;
      for (const part of parts) {
        combined.set(new Uint8Array(part), offset);
        offset += part.byteLength;
      }
      return combined.buffer;
    }

    function loadCrazyGamesSDK() {
      return new Promise(resolve => {
        const script = document.createElement("script");
        script.src = SDK_URL;

        script.onload = async () => {
          try {
            if (!window.CrazyGames?.SDK) {
              console.warn("CrazyGames SDK v3 API was not found.");
              resolve();
              return;
            }

            await window.CrazyGames.SDK.init({
              origin: "https://www.crazygames.com"
            });

            SendMessage("CrazySDKSingleton", "JSLibCallback_Init");

            window.CrazyGames.SDK.ad.hasAdblock()
              .then(result => SendMessage(
                "CrazySDKSingleton",
                "JSLibCallback_AdblockDetectionResult",
                result ? 1 : 0
              ))
              .catch(error => {
                console.error("Adblock detection failed:", error);
                SendMessage("CrazySDKSingleton", "JSLibCallback_AdblockDetectionResult", 0);
              });

            window.CrazyGames.SDK.user.addAuthListener(user => {
              SendMessage(
                "CrazySDKSingleton",
                "JSLibCallback_AuthListener",
                JSON.stringify({ userJson: JSON.stringify(user) })
              );
            });
          } catch (error) {
            console.error("CrazyGames SDK initialization failed:", error);
          } finally {
            resolve();
          }
        };

        script.onerror = () => {
          console.warn("CrazyGames SDK script failed to load.");
          resolve();
        };

        document.head.appendChild(script);
      });
    }

    async function startGame() {
      let dataUrl, wasmUrl;

      try {
        const [dataBuffer, wasmBuffer] = await Promise.all([
          joinParts("Tram4_CrazyGames.data.br", 4),
          joinParts("Tram4_CrazyGames.wasm.br", 3)
        ]);

        document.getElementById("loading").textContent = "Loading Unity loader...";

        const loader = document.createElement("script");
        loader.src = CDN + "Tram4_CrazyGames.loader.js";

        await new Promise((resolve, reject) => {
          loader.onload = resolve;
          loader.onerror = () => reject(new Error("Failed to load Unity loader from jsDelivr."));
          document.head.appendChild(loader);
        });

        // Reassemble the Brotli files. The Unity loader must support the
        // compressed Blob URLs for this configuration to work.
        dataUrl = URL.createObjectURL(new Blob([dataBuffer], {
          type: "application/octet-stream"
        }));
        wasmUrl = URL.createObjectURL(new Blob([wasmBuffer], {
          type: "application/wasm"
        }));

        await loadCrazyGamesSDK();

        document.getElementById("loading").textContent = "Starting Tram Simulator...";

        gameInstance = await createUnityInstance(
          document.getElementById("unity-canvas"),
          {
            dataUrl,
            frameworkUrl: CDN + "Tram4_CrazyGames.framework.js",
            codeUrl: wasmUrl,
            streamingAssetsUrl: CDN + "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "Tram Simulator",
            productVersion: "1.0"
          },
          progress => {
            document.getElementById("loading").textContent =
              "Loading Tram Simulator... " + Math.round(progress * 100) + "%";
          }
        );

        while (msgQueue.length) {
          const [obj, method, param] = msgQueue.shift();
          gameInstance.SendMessage(obj, method, param);
        }

        document.getElementById("loading").style.display = "none";
      } catch (error) {
        showError(error);
      } finally {
        if (gameInstance) {
          if (dataUrl) URL.revokeObjectURL(dataUrl);
          if (wasmUrl) URL.revokeObjectURL(wasmUrl);
        }
      }
    }

    startGame();
  </script>
</body>
</html>
