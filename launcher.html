<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SGS OS Launcher</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#000;color:#fff;font:14px/1.5 ui-monospace,Consolas,"Courier New",monospace}
main{width:min(420px,92vw);border:1px solid #fff}
header{background:#fff;color:#000;font-weight:700;padding:3px 12px}
section{padding:16px 12px}
p{margin:0 0 12px}
.mut{color:#9a9a9a}
button{font:inherit;color:#fff;background:#000;border:1px solid #fff;padding:8px 14px;cursor:pointer;width:100%}
button:hover,button:focus-visible{background:#fff;color:#000;outline:none}
#s{margin-top:12px;min-height:1.5em}
</style>
</head>
<body>
<main>
  <header>~/sgs-os-launcher</header>
  <section>
    <p>sgs@os:~$ ./launch</p>
    <p class="mut">Opens SGS OS in a new about:blank tab.</p>
    <button id="go">[ launch SGS OS ]</button>
    <div id="s" class="mut" role="status"></div>
  </section>
</main>
<script>
// ---- CHANGE THESE ----
const REPO = 'your-username/your-repo';  // GitHub "owner/name" that holds the app
const FILE = 'app.html';                 // path of the app file (match the capitalization exactly)
const MARKER = 'id="app-root"';          // a string the app always contains
// ----------------------

const $ = s => document.querySelector(s);
const say = t => { $('#s').textContent = t; };
const isSha = s => /^[a-f0-9]{40}$/.test(s || '');
const looksRight = h => /<html[\s>]/i.test(h) && h.includes(MARKER);

async function getApp() {
  // 1. Newest version from GitHub through jsDelivr (skipped until REPO is set)
  if (!REPO.includes('your-')) {
    let latest = '';
    try {
      const r = await fetch('https://api.github.com/repos/' + REPO + '/commits/main', { cache: 'no-store', signal: AbortSignal.timeout(8000) });
      if (r.ok) { const d = await r.json(); if (isSha(d.sha)) latest = d.sha; }
    } catch {}
    for (const ref of [...new Set([latest, 'main'].filter(Boolean))]) {
      for (const host of ['cdn.jsdelivr.net', 'fastly.jsdelivr.net', 'gcore.jsdelivr.net']) {
        try {
          const r = await fetch('https://' + host + '/gh/' + REPO + '@' + ref + '/' + FILE, { signal: AbortSignal.timeout(20000) });
          if (!r.ok) continue;
          const h = await r.text();
          if (looksRight(h)) return h;
        } catch {}
      }
    }
  }
  // 2. Fallback: the same file next to this launcher (works when both are hosted over http/https)
  try {
    const r = await fetch(FILE, { cache: 'no-store' });
    if (r.ok) { const h = await r.text(); if (looksRight(h)) return h; }
  } catch {}
  return null;
}

$('#go').onclick = async () => {
  // Open the tab right away, inside the click, so pop-up blockers allow it
  const w = window.open('about:blank', '_blank');
  if (!w) { say('Pop-up blocked. Allow pop-ups for this page, then click again.'); return; }
  w.document.write('<title>Loading…</title><body style="background:#000;color:#fff;font:14px monospace;padding:24px">Loading SGS OS…</body>');
  say('Loading…');
  const html = await getApp();
  if (w.closed) { say('The new tab was closed.'); return; }
  if (!html) {
    w.document.body.textContent = 'Could not load SGS OS. Close this tab, check your connection and try again.';
    say('Could not load the app. Check REPO and FILE at the top of this file.');
    return;
  }
  w.document.open(); w.document.write(html); w.document.close();
  say('Launched.');
};
</script>
</body>
</html>
